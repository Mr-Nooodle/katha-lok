# Refreshes the video list from YouTube and publishes the site to GitHub Pages.
# Runs every 2 hours, on every push, and on demand (Actions tab → "Sync videos and deploy" → Run workflow).
name: Sync videos and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest videos from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/sync-videos.mjs
      - name: Save the refreshed list in the repository
        run: |
          if ! git diff --quiet -- data/videos.json; then
            git config user.name "katha-lok-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Update video list [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
